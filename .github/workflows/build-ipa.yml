name: Build unsigned IPA

# Собирает .ipa без подписи на бесплатном macOS-раннере GitHub.
# Полученный файл потом подписывается вашим Apple ID в Sideloadly на Windows.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          xcodebuild \
            -project Spectrograph.xcodeproj \
            -scheme Spectrograph \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package into .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Spectrograph.app Payload/
          zip -qry Spectrograph.ipa Payload
          ls -la Spectrograph.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Spectrograph-ipa
          path: Spectrograph.ipa
          if-no-files-found: error
